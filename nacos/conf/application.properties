# ========== 禁用所有 Metrics Export（修复 Windows Docker 下的 processorMetrics NPE） ==========
management.metrics.export.prometheus.enabled=false
management.metrics.export.simple.enabled=false
management.defaults.metrics.export.enabled=false

# ========== 修复 gRPC 端口通信问题（macOS Docker Desktop 兼容性） ==========
# 显式指定 Nacos gRPC 端口偏移量，确保客户端能正确连接到 gRPC 端口
nacos.remote.server.rpc.port.offset=1000
# 缩短 gRPC 服务启动等待时间
nacos.core.support.upgrade.from.1x=false
