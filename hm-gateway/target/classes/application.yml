server:
  port: 8080                       # 网关端口

spring:
  application:
    name: hm-gateway               # 服务名称
  cloud:
    nacos:
      server-addr: localhost:8848  # Nacos 注册中心地址
    gateway:
      routes:
        # ========== 购物车服务 ==========
        - id: cart-service         # 路由 ID（唯一即可）
          uri: lb://cart-service   # 指向 cart-service 微服务，lb:// 表示负载均衡
          predicates:
            - Path=/carts/**       # 匹配 /carts/** 的请求转发到购物车服务

        # ========== 订单服务 ==========
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/orders/**

        # ========== 商品服务 ==========
        - id: item-service
          uri: lb://item-service
          predicates:
            - Path=/items/**,/search/**
        # ========== 用户服务 ==========
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**,/addresses/**

        # ========== 支付服务 ==========
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**
      # 注意缩进！！！
      default-filters: #默认过滤器 会对所有的路由生效
        - PrintAny=1,2,3
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi