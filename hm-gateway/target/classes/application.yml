server:
  port: 8080                       # 网关端口

spring:
  application:
    name: hm-gateway               # 服务名称
  cloud:
    nacos:
      server-addr: localhost:8848  # Nacos 注册中心地址
    gateway:
      routes:
        # ========== 购物车服务 ==========
        - id: cart-service         # 路由 ID（唯一即可）
          uri: lb://cart-service   # 指向 cart-service 微服务，lb:// 表示负载均衡
          predicates:
            - Path=/carts/**       # 匹配 /carts/** 的请求转发到购物车服务

        # ========== 订单服务 ==========
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/orders/**

        # ========== 商品服务 ==========
        - id: item-service
          uri: lb://item-service
#          predicates:
#            - Path=/api/items/**,/api/search/**   # /items/** 和 /search/** 都转发到商品服务
#            - Method=GET,POST
#          filters:
#            - StripPrefix=1  # 去掉前缀，即 /api/items/1 转发到 /items/1
          predicates:
            - Path=/items/**,/search/**
        # ========== 用户服务 ==========
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**,/addresses/**

        # ========== 支付服务 ==========
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**
      default-filters: #默认过滤器 会对所有的路由生效
        - PrintAny