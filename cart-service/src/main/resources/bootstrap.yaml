server:
  port: 8083
spring:
  application:
    name: cart-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: localhost:8848
      config: #共享配置信息
        file-extension: yaml # 配置扩展名
        shared-configs:
          - data-id: shared-jdbc.yaml
          - data-id: shared-log.yaml
          - data-id: shared-swagger.yaml
          - data-id: cart-service.yaml
            refresh: true
          - data-id: shared-seata.yaml
